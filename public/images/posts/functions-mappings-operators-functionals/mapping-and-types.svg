<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680"><rect width="1200" height="680" fill="#0d2034"/>
<text x="58" y="68" font-family="Arial,'Noto Sans',sans-serif" font-size="38" fill="#f4f8ff" font-weight="700">同一套映射语言，不同的数学角色</text>
<text x="58" y="111" font-family="Arial,'Noto Sans',sans-serif" font-size="20" fill="#9fc6dd" >The input, output, and preserved structure determine what we study.</text>
<rect x="55" y="155" width="280" height="85" rx="12" fill="#f1f7fc" stroke="#b0c5da" stroke-width="2"/><text x="195" y="190" font-family="Arial,'Noto Sans',sans-serif" font-size="24" fill="#183a58" text-anchor="middle" font-weight="600">标量</text><text x="195" y="220" font-family="Arial,'Noto Sans',sans-serif" font-size="18" fill="#4a647b" text-anchor="middle">x ∈ R</text><path d="M346 196 L480 196" fill="none" stroke="#41a5ae" stroke-width="5"/><polygon points="480,196 465,188 465,204" fill="#41a5ae"/><rect x="500" y="155" width="350" height="85" rx="12" fill="#17405a" stroke="#438fab" stroke-width="2"/><text x="675" y="190" font-family="Arial,'Noto Sans',sans-serif" font-size="27" fill="#ffffff" text-anchor="middle">f : R → R</text><text x="675" y="222" font-family="Arial,'Noto Sans',sans-serif" font-size="22" fill="#b7e6e1" text-anchor="middle">f(x) = x²</text>
<rect x="55" y="270" width="280" height="85" rx="12" fill="#f1f7fc" stroke="#b0c5da" stroke-width="2"/><text x="195" y="305" font-family="Arial,'Noto Sans',sans-serif" font-size="24" fill="#183a58" text-anchor="middle" font-weight="600">向量</text><text x="195" y="335" font-family="Arial,'Noto Sans',sans-serif" font-size="18" fill="#4a647b" text-anchor="middle">v ∈ Rⁿ</text><path d="M346 311 L480 311" fill="none" stroke="#4da99a" stroke-width="5"/><polygon points="480,311 465,303 465,319" fill="#4da99a"/><rect x="500" y="270" width="350" height="85" rx="12" fill="#17405a" stroke="#438fab" stroke-width="2"/><text x="675" y="305" font-family="Arial,'Noto Sans',sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">T : Rⁿ → Rᵐ</text><text x="675" y="337" font-family="Arial,'Noto Sans',sans-serif" font-size="22" fill="#b7e6e1" text-anchor="middle">T(v) = Av</text>
<rect x="55" y="385" width="280" height="85" rx="12" fill="#f1f7fc" stroke="#b0c5da" stroke-width="2"/><text x="195" y="420" font-family="Arial,'Noto Sans',sans-serif" font-size="24" fill="#183a58" text-anchor="middle" font-weight="600">函数</text><text x="195" y="450" font-family="Arial,'Noto Sans',sans-serif" font-size="18" fill="#4a647b" text-anchor="middle">f ∈ C([0,1])</text><path d="M346 426 L480 426" fill="none" stroke="#8ab1ed" stroke-width="5"/><polygon points="480,426 465,418 465,434" fill="#8ab1ed"/><rect x="500" y="385" width="350" height="85" rx="12" fill="#17405a" stroke="#438fab" stroke-width="2"/><text x="675" y="420" font-family="Arial,'Noto Sans',sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">J : C → C¹</text><text x="675" y="452" font-family="Arial,'Noto Sans',sans-serif" font-size="21" fill="#b7e6e1" text-anchor="middle">J[f](x) = ∫₀ˣ f(t)dt</text>
<rect x="55" y="500" width="280" height="85" rx="12" fill="#f1f7fc" stroke="#b0c5da" stroke-width="2"/><text x="195" y="535" font-family="Arial,'Noto Sans',sans-serif" font-size="24" fill="#183a58" text-anchor="middle" font-weight="600">函数</text><text x="195" y="565" font-family="Arial,'Noto Sans',sans-serif" font-size="18" fill="#4a647b" text-anchor="middle">f ∈ C([0,1])</text><path d="M346 541 L480 541" fill="none" stroke="#c5a2f0" stroke-width="5"/><polygon points="480,541 465,533 465,549" fill="#c5a2f0"/><rect x="500" y="500" width="350" height="85" rx="12" fill="#17405a" stroke="#438fab" stroke-width="2"/><text x="675" y="535" font-family="Arial,'Noto Sans',sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">Φ : C → R</text><text x="675" y="567" font-family="Arial,'Noto Sans',sans-serif" font-size="21" fill="#b7e6e1" text-anchor="middle">Φ[f] = ∫₀¹ f(t)dt</text>
<text x="900" y="210" font-family="Arial,'Noto Sans',sans-serif" font-size="21" fill="#d7e8f5" >函数 / 映射</text>
<text x="900" y="325" font-family="Arial,'Noto Sans',sans-serif" font-size="21" fill="#d7e8f5" >线性变换</text>
<text x="900" y="440" font-family="Arial,'Noto Sans',sans-serif" font-size="21" fill="#d7e8f5" >积分算子</text>
<text x="900" y="555" font-family="Arial,'Noto Sans',sans-serif" font-size="21" fill="#d7e8f5" >线性泛函</text>
<text x="58" y="640" font-family="Arial,'Noto Sans',sans-serif" font-size="17" fill="#9bb8ce" >C = C([0,1]); here J[f](x) = ∫₀ˣ f(t)dt and Φ[f] = ∫₀¹ f(t)dt.</text>
</svg>