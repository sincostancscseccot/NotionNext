<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760"><rect width="1200" height="760" fill="#0b1628"/>
<text x="54" y="65" font-family="Arial,'Noto Sans',sans-serif" font-size="43" fill="#f2f8ff" font-weight="700">NABLA   ∇</text>
<text x="54" y="110" font-family="Arial,'Noto Sans',sans-serif" font-size="24" fill="#bbd2e7" >直角坐标中：一个形式微分向量，通过不同组合形成运算</text>
<rect x="340" y="145" width="520" height="93" rx="16" fill="#163d54" stroke="#63c8ba" stroke-width="2"/>
<text x="600" y="185" font-family="Arial,'Noto Sans',sans-serif" font-size="30" fill="#f6fdff" text-anchor="middle">∇ = (∂x, ∂y, ∂z)</text>
<text x="600" y="215" font-family="Arial,'Noto Sans',sans-serif" font-size="18" fill="#b0dcd3" text-anchor="middle">符号中的分量是偏微分算子</text>
<path d="M600 240 L600 274" fill="none" stroke="#8bb6d3" stroke-width="3"/>
<path d="M170 274 L1030 274" fill="none" stroke="#8bb6d3" stroke-width="3"/>
<path d="M170 274 L170 309" fill="none" stroke="#8bb6d3" stroke-width="3"/><path d="M455 274 L455 309" fill="none" stroke="#8bb6d3" stroke-width="3"/><path d="M745 274 L745 309" fill="none" stroke="#8bb6d3" stroke-width="3"/><path d="M1030 274 L1030 309" fill="none" stroke="#8bb6d3" stroke-width="3"/>
<rect x="36" y="310" width="265" height="164" rx="14" fill="#152e49" stroke="#47bca8" stroke-width="2"/><text x="168.5" y="353" font-family="Arial,'Noto Sans',sans-serif" font-size="20" fill="#47bca8" text-anchor="middle" font-weight="700">GRADIENT</text><text x="168.5" y="408" font-family="Arial,'Noto Sans',sans-serif" font-size="37" fill="#ffffff" text-anchor="middle">∇f</text><text x="168.5" y="445" font-family="Arial,'Noto Sans',sans-serif" font-size="18" fill="#bad4e5" text-anchor="middle">标量 → 向量</text><rect x="320" y="310" width="265" height="164" rx="14" fill="#152e49" stroke="#83aff2" stroke-width="2"/><text x="452.5" y="353" font-family="Arial,'Noto Sans',sans-serif" font-size="20" fill="#83aff2" text-anchor="middle" font-weight="700">DIVERGENCE</text><text x="452.5" y="408" font-family="Arial,'Noto Sans',sans-serif" font-size="37" fill="#ffffff" text-anchor="middle">∇ · F</text><text x="452.5" y="445" font-family="Arial,'Noto Sans',sans-serif" font-size="18" fill="#bad4e5" text-anchor="middle">向量 → 标量</text><rect x="606" y="310" width="265" height="164" rx="14" fill="#152e49" stroke="#c3a4f5" stroke-width="2"/><text x="738.5" y="353" font-family="Arial,'Noto Sans',sans-serif" font-size="20" fill="#c3a4f5" text-anchor="middle" font-weight="700">CURL</text><text x="738.5" y="408" font-family="Arial,'Noto Sans',sans-serif" font-size="37" fill="#ffffff" text-anchor="middle">∇ × F</text><text x="738.5" y="445" font-family="Arial,'Noto Sans',sans-serif" font-size="18" fill="#bad4e5" text-anchor="middle">向量 → 向量</text><rect x="893" y="310" width="265" height="164" rx="14" fill="#152e49" stroke="#e5b578" stroke-width="2"/><text x="1025.5" y="353" font-family="Arial,'Noto Sans',sans-serif" font-size="20" fill="#e5b578" text-anchor="middle" font-weight="700">LAPLACIAN</text><text x="1025.5" y="408" font-family="Arial,'Noto Sans',sans-serif" font-size="37" fill="#ffffff" text-anchor="middle">Δf</text><text x="1025.5" y="445" font-family="Arial,'Noto Sans',sans-serif" font-size="18" fill="#bad4e5" text-anchor="middle">标量 → 标量</text>
<rect x="64" y="522" width="1072" height="169" rx="14" fill="#12273d" stroke="#476b8b" stroke-width="2"/>
<text x="110" y="564" font-family="Arial,'Noto Sans',sans-serif" font-size="28" fill="#e8f2fb" font-weight="700">同一符号 ≠ 同一运算规则</text>
<text x="110" y="610" font-family="Arial,'Noto Sans',sans-serif" font-size="27" fill="#b4eadf" >Δf = div(grad f) = ∂²f/∂x² + ∂²f/∂y² + ∂²f/∂z²</text>
<text x="110" y="656" font-family="Arial,'Noto Sans',sans-serif" font-size="18" fill="#9fc5dc" >适用前提：三维欧氏空间、笛卡尔直角坐标与足够光滑的场</text>
</svg>