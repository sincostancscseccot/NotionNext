    <line x1="115" y1="400" x2="525" y2="400"/><line x1="175" y1="285" x2="465" y2="285"/><line x1="230" y1="180" x2="410" y2="180"/><line x1="270" y1="95" x2="370" y2="95"/>
   </g>
   <text x="286" y="72" class="label">寄存器</text>
