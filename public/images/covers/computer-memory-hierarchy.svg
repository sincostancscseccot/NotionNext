<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071522"/><stop offset="1" stop-color="#10283a"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8bd5ff"/><stop offset="1" stop-color="#d7f2ff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:700 64px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#f3f7fb}
    .small{font:500 28px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#b8c8d6}
    .series{font:600 28px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#8bd5ff;letter-spacing:5px}
    .label{font:600 24px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#d8e6ef}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1400" cy="120" r="260" fill="#8bd5ff" opacity=".05"/>
<circle cx="1310" cy="780" r="310" fill="#8bd5ff" opacity=".035"/>
<text x="88" y="105" class="series">计算机基础 · 存储层级</text>
<line x1="88" y1="130" x2="420" y2="130" stroke="#8bd5ff" stroke-width="3" opacity=".65"/>
<text x="88" y="270" class="title">计算机为什么需要这么多种“记忆”？</text><text x="88" y="362" class="title">从寄存器到硬盘</text>
<g transform="translate(900 150)">
   <polygon points="320,0 610,560 30,560" fill="#0c2538" stroke="#396783" stroke-width="3"/>
