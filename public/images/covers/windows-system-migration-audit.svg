  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#f4f8ff">
    <text x="800" y="745" font-size="58" font-weight="700" text-anchor="middle" letter-spacing="2">PC ENVIRONMENT AUDIT</text>
    <text x="800" y="803" font-size="26" text-anchor="middle" fill="#b7d7e7" letter-spacing="7">REINSTALL • MIGRATE • RESTORE</text>
