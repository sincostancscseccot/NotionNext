<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#15233b"/>
      <stop offset="1" stop-color="#0b6b78"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3353" stop-opacity=".96"/>
      <stop offset="1" stop-color="#10243a" stop-opacity=".96"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1325" cy="120" r="280" fill="#56d7e6" opacity=".08"/>
  <circle cx="180" cy="820" r="340" fill="#7aa8ff" opacity=".07"/>

  <g opacity=".18" stroke="#9adfea">
    <path d="M0 155H1600M0 450H1600M0 745H1600" />
    <path d="M260 0V900M800 0V900M1340 0V900" />
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="150" rx="34" width="480" height="520" fill="url(#card)" stroke="#6fa7d9" stroke-opacity=".35"/>
    <rect x="1000" y="150" rx="34" width="480" height="520" fill="url(#card)" stroke="#6fe3d5" stroke-opacity=".38"/>
  </g>

  <!-- old machine -->
  <g transform="translate(175 215)">
    <rect width="370" height="220" rx="20" fill="#0a1526" stroke="#89a9ce" stroke-width="3"/>
    <rect x="25" y="28" width="150" height="68" rx="10" fill="#1f4a72"/>
    <rect x="195" y="28" width="150" height="68" rx="10" fill="#2b675f"/>
    <rect x="25" y="118" width="320" height="72" rx="10" fill="#17263c"/>
    <circle cx="48" cy="143" r="7" fill="#62d6e6"/>
    <circle cx="73" cy="143" r="7" fill="#7ba8ff"/>
    <circle cx="98" cy="143" r="7" fill="#71d9a4"/>
    <path d="M128 144h175" stroke="#8aa1bc" stroke-width="8" stroke-linecap="round"/>
    <path d="M128 169h122" stroke="#536c87" stroke-width="7" stroke-linecap="round"/>
    <path d="M155 242h60v42h-60zM110 284h150" stroke="#6f8eae" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- new machine -->
  <g transform="translate(1055 215)">
    <rect width="370" height="220" rx="20" fill="#071c24" stroke="#7ee1d9" stroke-width="3"/>
    <rect x="25" y="28" width="320" height="68" rx="10" fill="#14525e"/>
    <rect x="25" y="118" width="150" height="72" rx="10" fill="#20425f"/>
    <rect x="195" y="118" width="150" height="72" rx="10" fill="#1f6657"/>
    <path d="M155 242h60v42h-60zM110 284h150" stroke="#78b9b8" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- audit flow -->
  <g>
    <rect x="668" y="250" width="264" height="150" rx="28" fill="#142a42" stroke="#75d3e2" stroke-width="3"/>
    <path d="M710 292h180M710 327h142M710 362h112" stroke="#9bd7e5" stroke-width="11" stroke-linecap="round"/>
    <circle cx="882" cy="362" r="19" fill="none" stroke="#7cf0cf" stroke-width="8"/>
    <path d="M895 375l31 31" stroke="#7cf0cf" stroke-width="8" stroke-linecap="round"/>
    <path d="M605 325h52" stroke="#92c1e8" stroke-width="8" stroke-linecap="round"/>
