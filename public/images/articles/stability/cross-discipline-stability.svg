<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07121f"/><stop offset="1" stop-color="#10263a"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#69cfff"/></marker>
<marker id="arrY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffd166"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff6f91"/></marker>
<style>.title{font:700 62px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#f6fbff}.sub{font:500 30px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#bcd0df}.series{font:600 26px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#6fd6ff;letter-spacing:4px}.h{font:700 36px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#f5fbff}.t{font:500 25px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#d8e8f1}.sm{font:500 21px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#b9ccda}.math{font:italic 32px Georgia,'Times New Roman',serif;fill:#f7fbff}</style>
</defs>
<rect width="1600" height="900" fill="#07121f"/><text x="800" y="80" text-anchor="middle" class="title">同一种稳定性语言，在不同学科中出现</text>
<g transform="translate(620 320)"><rect width="360" height="190" rx="28" fill="#2a281b" stroke="#ffd166" stroke-width="4"/><path d="M105 55 C135 70 145 130 180 136 C215 130 225 70 255 55" fill="none" stroke="#ffd166" stroke-width="5"/><circle cx="180" cy="126" r="15" fill="#ffd166"/><text x="180" y="175" text-anchor="middle" class="h">稳定性 / 扰动衰减</text></g>
<g transform="translate(70 150)"><rect width="450" height="220" rx="24" fill="#0c2a40" stroke="#69cfff" stroke-width="3"/><text x="35" y="65" class="h" fill="#69cfff">力学：恢复力 + 耗散</text><text x="35" y="115" class="t">受扰动后，由恢复力和阻尼</text><text x="35" y="153" class="t">共同把系统带回平衡附近。</text><path d="M355 130 h55" stroke="#69cfff" stroke-width="5"/><path d="M355 110 q28 -35 55 0" fill="none" stroke="#69cfff" stroke-width="5"/></g>
<g transform="translate(1080 150)"><rect width="450" height="220" rx="24" fill="#0d352d" stroke="#7cf0bd" stroke-width="3"/><text x="35" y="65" class="h" fill="#7cf0bd">化学：平衡 / 自由能</text><text x="35" y="115" class="t">外界条件改变后，体系向新的</text><text x="35" y="153" class="t">热力学平衡重新演化。</text><path d="M350 95 C370 120 390 175 420 185" fill="none" stroke="#7cf0bd" stroke-width="5"/></g>
<g transform="translate(70 550)"><rect width="450" height="220" rx="24" fill="#3b2026" stroke="#ff7e91" stroke-width="3"/><text x="35" y="65" class="h" fill="#ff8b9e">生物：稳态 / 负反馈</text><text x="35" y="115" class="t">通过传感、调节与执行机制，</text><text x="35" y="153" class="t">让偏离目标的状态逐步减小。</text><path d="M340 145 c25 -35 80 -35 95 0 c-15 35 -70 35 -95 0" fill="none" stroke="#ff8b9e" stroke-width="4"/></g>
<g transform="translate(1080 550)"><rect width="450" height="220" rx="24" fill="#2e2140" stroke="#c792ff" stroke-width="3"/><text x="35" y="65" class="h" fill="#d3a7ff">控制：闭环 / 误差校正</text><text x="35" y="115" class="t">把输出送回输入端比较，</text><text x="35" y="153" class="t">用反馈不断压小误差。</text><path d="M330 115 h80 v55 h-80 z" fill="none" stroke="#c792ff" stroke-width="4"/></g>
<path d="M520 260 C575 285 600 315 630 350" fill="none" stroke="#69cfff" stroke-width="5" marker-end="url(#arrB)"/><path d="M1080 260 C1025 285 1000 315 970 350" fill="none" stroke="#7cf0bd" stroke-width="5" marker-end="url(#arrB)"/><path d="M520 660 C575 620 600 560 640 500" fill="none" stroke="#ff7e91" stroke-width="5" marker-end="url(#arrR)"/><path d="M1080 660 C1025 620 1000 560 960 500" fill="none" stroke="#c792ff" stroke-width="5" marker-end="url(#arrB)"/>
<text x="800" y="855" text-anchor="middle" class="sub">它们不是同一条定律，而是相似的动力学结构。</text></svg>