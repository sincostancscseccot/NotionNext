<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><defs><style>.t{font:700 34px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#eef9fc}.n{font:600 28px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#effaff}.s{font:500 21px "Noto Sans SC","Microsoft YaHei",sans-serif;fill:#bdd4dd}</style></defs><rect width="1400" height="720" rx="28" fill="#071b26"/><text x="80" y="70" class="t">同一种稳定性语言，在不同学科中由不同机制实现</text><circle cx="700" cy="380" r="112" fill="#123c4e" stroke="#6adfff" stroke-width="4"/><text x="628" y="372" class="n">稳定性</text><text x="610" y="410" class="s">扰动是否衰减？</text><g><rect x="110" y="170" width="330" height="130" rx="22" fill="#102f3f" stroke="#5dd2ff"/><text x="225" y="220" class="n">力学</text><text x="165" y="260" class="s">恢复力 + 阻尼</text><rect x="960" y="170" width="330" height="130" rx="22" fill="#102f3f" stroke="#5dd2ff"/><text x="1075" y="220" class="n">化学</text><text x="1010" y="260" class="s">自由能与化学平衡</text><rect x="110" y="500" width="330" height="130" rx="22" fill="#102f3f" stroke="#72efc1"/><text x="225" y="550" class="n">生物</text><text x="155" y="590" class="s">稳态调节与反馈回路</text><rect x="960" y="500" width="330" height="130" rx="22" fill="#102f3f" stroke="#72efc1"/><text x="1075" y="550" class="n">控制</text><text x="1015" y="590" class="s">闭环反馈与极点</text></g><g stroke="#94dff2" stroke-width="3" opacity=".7"><line x1="440" y1="250" x2="605" y2="330"/><line x1="960" y1="250" x2="795" y2="330"/><line x1="440" y1="565" x2="605" y2="430"/><line x1="960" y1="565" x2="795" y2="430"/></g></svg>