<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07121f"/><stop offset="1" stop-color="#10263a"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#69cfff"/></marker>
<marker id="arrY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffd166"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff6f91"/></marker>
<style>.title{font:700 62px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#f6fbff}.sub{font:500 30px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#bcd0df}.series{font:600 26px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#6fd6ff;letter-spacing:4px}.h{font:700 36px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#f5fbff}.t{font:500 25px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#d8e8f1}.sm{font:500 21px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#b9ccda}.math{font:italic 32px Georgia,'Times New Roman',serif;fill:#f7fbff}</style>
</defs>
<rect width="1600" height="900" fill="#07121f"/><text x="800" y="80" text-anchor="middle" class="title">稳定平衡 vs 不稳定平衡</text>
<g transform="translate(45 135)"><rect width="730" height="650" rx="26" fill="#0a2030" stroke="#3aaeff" stroke-width="3"/><text x="365" y="75" text-anchor="middle" class="h" fill="#69cfff">稳定平衡</text><path d="M70 150 C175 180 245 500 365 520 C485 500 555 180 660 150" fill="none" stroke="#52bfff" stroke-width="8"/><circle cx="365" cy="500" r="24" fill="#dbe6ee"/><text x="305" y="580" class="t">平衡位置（最低点）</text><circle cx="160" cy="300" r="24" fill="#62c8ff"/><circle cx="570" cy="300" r="24" fill="#62c8ff"/><path d="M190 330 C235 385 275 440 325 470" fill="none" stroke="#62c8ff" stroke-width="6" marker-end="url(#arrB)"/><path d="M540 330 C495 385 455 440 405 470" fill="none" stroke="#62c8ff" stroke-width="6" marker-end="url(#arrB)"/><text x="90" y="250" class="sm">受扰动（向左偏离）</text><text x="470" y="250" class="sm">受扰动（向右偏离）</text></g>
<g transform="translate(825 135)"><rect width="730" height="650" rx="26" fill="#26151f" stroke="#ff6f7f" stroke-width="3"/><text x="365" y="75" text-anchor="middle" class="h" fill="#ff8698">不稳定平衡</text><path d="M70 520 C175 490 245 190 365 165 C485 190 555 490 660 520" fill="none" stroke="#ff6f7f" stroke-width="8"/><circle cx="365" cy="150" r="24" fill="#dbe6ee"/><text x="290" y="110" class="sm">平衡位置（最高点）</text><circle cx="250" cy="260" r="24" fill="#ff6f7f"/><circle cx="480" cy="260" r="24" fill="#ff6f7f"/><path d="M225 290 C190 345 155 405 120 455" fill="none" stroke="#ff6f7f" stroke-width="6" marker-end="url(#arrR)"/><path d="M505 290 C540 345 575 405 610 455" fill="none" stroke="#ff6f7f" stroke-width="6" marker-end="url(#arrR)"/><text x="85" y="230" class="sm">向左偏离后继续远离</text><text x="445" y="230" class="sm">向右偏离后继续远离</text></g>
<text x="800" y="850" text-anchor="middle" class="h" font-size="32">关键不在“此刻静止”，而在于受扰动后会发生什么。</text></svg>