<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-label="密码学双重结构：参与者能力差异与攻击者观察不可区分"><rect width="1100" height="460" fill="#f7fbfd"/><text x="550" y="63" font-size="31" font-weight="bold" font-family="sans-serif" fill="#173a52" text-anchor="middle">两种视角：制造差异，隐藏差异</text><rect x="75" y="115" width="425" height="270" rx="18" fill="#e5f5ea" stroke="#5eae81" stroke-width="2"/><rect x="600" y="115" width="425" height="270" rx="18" fill="#e2f1fb" stroke="#68a3c6" stroke-width="2"/><g font-family="sans-serif" text-anchor="middle"><text x="287" y="170" font-size="28" font-weight="bold" fill="#27684c">参与者之间</text><text x="287" y="226" font-size="24" fill="#346750">合法者掌握密钥</text><text x="287" y="268" font-size="24" fill="#346750">攻击者未掌握密钥</text><text x="287" y="325" font-size="25" fill="#286c4f">能力差异</text><text x="812" y="170" font-size="28" font-weight="bold" fill="#2c638b">攻击者的观察</text><text x="812" y="226" font-size="24" fill="#356d8b">不同候选明文</text><text x="812" y="268" font-size="24" fill="#356d8b">难以从密文辨别</text><text x="812" y="325" font-size="25" fill="#2d668d">不可区分</text></g></svg>