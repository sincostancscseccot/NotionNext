<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-label="一次一密：相同异或运算实现加密和解密"><rect width="1100" height="500" fill="#f7fbfd"/><text x="550" y="70" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#17354c">算法可以对称，信息却不必对称</text><g font-family="sans-serif" text-anchor="middle" fill="#17354c"><rect x="85" y="142" width="220" height="110" rx="18" fill="#d7edf7"/><rect x="440" y="142" width="220" height="110" rx="18" fill="#f8eac7"/><rect x="795" y="142" width="220" height="110" rx="18" fill="#d7edf7"/><text x="195" y="185" font-size="25">明文 M</text><text x="195" y="230" font-size="38" font-weight="bold">1</text><text x="550" y="185" font-size="25">秘密密钥 K</text><text x="550" y="230" font-size="38" font-weight="bold">0</text><text x="905" y="185" font-size="25">密文 C</text><text x="905" y="230" font-size="38" font-weight="bold">1</text></g><path d="M305 195 H417M660 195H772" stroke="#427b9e" stroke-width="4"/><path d="M405 185l16 10-16 10M760 185l16 10-16 10" fill="none" stroke="#427b9e" stroke-width="4"/><text x="550" y="335" text-anchor="middle" font-family="sans-serif" font-size="31" fill="#17354c">加密：C = M ⊕ K</text><text x="550" y="389" text-anchor="middle" font-family="sans-serif" font-size="31" fill="#17354c">解密：M = C ⊕ K</text><text x="550" y="451" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#637b8b">两次运算相同；安全性取决于密钥的秘密性与使用条件</text></svg>