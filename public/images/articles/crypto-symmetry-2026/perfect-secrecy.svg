<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
<rect width="1600" height="940" fill="#f7fafc"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<text x="90" y="109" font-size="52" font-weight="700" fill="#17364f">完美保密：观察密文，不改变明文概率分布</text>
<text x="90" y="170" font-size="29" fill="#5c7283">示例：P(M=0)=70%，P(M=1)=30%；密钥 K 独立且均匀随机</text>
<rect x="95" y="241" width="670" height="510" rx="26" fill="#fff" stroke="#d3dfe8" stroke-width="3"/>
<rect x="835" y="241" width="670" height="510" rx="26" fill="#fff" stroke="#d3dfe8" stroke-width="3"/>
<text x="430" y="307" font-size="36" font-weight="700" fill="#244662" text-anchor="middle">观察密文之前</text>
<text x="1170" y="307" font-size="36" font-weight="700" fill="#244662" text-anchor="middle">观察密文之后</text>
<g stroke="#acbdcb" stroke-width="2"><path d="M165 655H690"/><path d="M905 655H1430"/></g>
<rect x="245" y="410" width="124" height="245" rx="12" fill="#3c8caa"/><rect x="495" y="550" width="124" height="105" rx="12" fill="#ddab66"/>
<rect x="985" y="410" width="124" height="245" rx="12" fill="#3c8caa"/><rect x="1235" y="550" width="124" height="105" rx="12" fill="#ddab66"/>
<g font-size="36" font-weight="700" text-anchor="middle" fill="#21465b"><text x="307" y="386">70%</text><text x="557" y="526">30%</text><text x="1047" y="386">70%</text><text x="1297" y="526">30%</text></g>
<g font-size="28" text-anchor="middle" fill="#526b7f"><text x="307" y="703">M = 0</text><text x="557" y="703">M = 1</text><text x="1047" y="703">M = 0</text><text x="1297" y="703">M = 1</text></g>
<rect x="95" y="785" width="1410" height="106" rx="18" fill="#e4f0ef"/>
<text x="800" y="832" text-anchor="middle" font-size="35" font-weight="700" fill="#225b58">P(M=m | C=c) = P(M=m)</text><text x="800" y="868" text-anchor="middle" font-size="22" fill="#487575">注意：先验概率不必相等；保持不变的是观察密文后的概率判断</text>
</g></svg>