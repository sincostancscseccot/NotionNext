<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5384b0"/></marker></defs>
<rect width="1600" height="900" fill="#f5f8fc"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<text x="86" y="104" font-size="50" font-weight="700" fill="#182d49">四个入口，构成一次知识发现循环</text><text x="87" y="154" font-size="24" fill="#55718d">并不是从工具名称开始，而是从不同的探索起点走向候选技术</text>
</g>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<g><rect x="63" y="216" width="339" height="160" rx="22" fill="#e8f4ff" stroke="#8cb9e3" stroke-width="2"/><text x="88" y="268" font-size="24" fill="#4173a2">01</text><text x="88" y="315" font-size="34" font-weight="700" fill="#173651">需求入口</text><text x="88" y="351" font-size="20" fill="#51697e">我想解决什么问题？</text></g>
<g><rect x="441" y="216" width="339" height="160" rx="22" fill="#e9f7f3" stroke="#8bc6b2" stroke-width="2"/><text x="466" y="268" font-size="24" fill="#358c74">02</text><text x="466" y="315" font-size="34" font-weight="700" fill="#173651">结构入口</text><text x="466" y="351" font-size="20" fill="#51697e">系统由哪些部分组成？</text></g>
<g><rect x="819" y="216" width="339" height="160" rx="22" fill="#f0ecfc" stroke="#b4a5e2" stroke-width="2"/><text x="844" y="268" font-size="24" fill="#7964bc">03</text><text x="844" y="315" font-size="34" font-weight="700" fill="#173651">关联入口</text><text x="844" y="351" font-size="20" fill="#51697e">有哪些依赖、替代和交叉？</text></g>
<g><rect x="1197" y="216" width="339" height="160" rx="22" fill="#fff2e6" stroke="#e0b88d" stroke-width="2"/><text x="1222" y="268" font-size="24" fill="#b17a48">04</text><text x="1222" y="315" font-size="34" font-weight="700" fill="#173651">外部入口</text><text x="1222" y="351" font-size="20" fill="#51697e">陌生领域和不同来源</text></g>
</g>
