<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07121f"/><stop offset="1" stop-color="#10263a"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#69cfff"/></marker>
<marker id="arrY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffd166"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff6f91"/></marker>
<style>.title{font:700 62px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#f6fbff}.sub{font:500 30px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#bcd0df}.series{font:600 26px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#6fd6ff;letter-spacing:4px}.h{font:700 36px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#f5fbff}.t{font:500 25px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#d8e8f1}.sm{font:500 21px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#b9ccda}.math{font:italic 32px Georgia,'Times New Roman',serif;fill:#f7fbff}</style>
</defs>
<rect width="1600" height="650" fill="#07121f"/><text x="800" y="90" text-anchor="middle" class="title">正反馈</text>
<g transform="translate(70 210)"><rect x="0" y="0" width="390" height="150" rx="22" fill="#0f3a66" stroke="#5ebeff" stroke-width="4"/><text x="195" y="65" text-anchor="middle" class="h">初始变化</text><text x="195" y="110" text-anchor="middle" class="t">例如：温度上升</text><line x1="390" y1="75" x2="600" y2="75" stroke="#79dcaa" stroke-width="7" marker-end="url(#arrB)"/><rect x="620" y="0" width="390" height="150" rx="22" fill="#174d39" stroke="#7cf0bd" stroke-width="4"/><text x="815" y="65" text-anchor="middle" class="h">放大机制</text><text x="815" y="110" text-anchor="middle" class="t">同向增强</text><line x1="1010" y1="75" x2="1220" y2="75" stroke="#ff718d" stroke-width="7" marker-end="url(#arrR)"/><rect x="1240" y="0" width="290" height="150" rx="22" fill="#55202a" stroke="#ff718d" stroke-width="4"/><text x="1385" y="65" text-anchor="middle" class="h">更大变化</text><text x="1385" y="110" text-anchor="middle" class="t">偏差被放大</text><path d="M1385 150 V300 H190 V158" fill="none" stroke="#ff718d" stroke-width="7" marker-end="url(#arrR)"/><circle cx="790" cy="300" r="33" fill="#2b1d26" stroke="#ff718d" stroke-width="4"/><text x="790" y="313" text-anchor="middle" class="h">+</text></g>
<text x="800" y="600" text-anchor="middle" class="sub">变化本身会制造更多同方向的变化。</text></svg>