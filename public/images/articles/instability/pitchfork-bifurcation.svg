<line x1="750" y1="175" x2="750" y2="790" stroke="#8799aa" stroke-width="2" stroke-dasharray="8 10"/><text x="1300" y="240" class="math">x=√μ</text><text x="1280" y="750" class="math">x=−√μ</text><text x="315" y="455" class="t">稳定：x=0</text><text x="1030" y="455" class="t" fill="#ff718d">不稳定：x=0</text><text x="300" y="845" class="sub">μ&lt;0：只有稳定平衡点 x=0</text><text x="950" y="845" class="sub">μ&gt;0：出现两个新稳定平衡点 x=±√μ</text></svg>